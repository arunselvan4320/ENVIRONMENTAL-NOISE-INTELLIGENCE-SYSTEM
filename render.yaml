services:
  - type: web
    name: kaanam-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: KAANAM_DEMO
        value: "1"
      - key: KAANAM_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
